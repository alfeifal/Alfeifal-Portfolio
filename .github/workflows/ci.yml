name: CI
on:
  push:
    branches: ["**"]
  pull_request:

# This job only reads the repository. Without this block the token takes the repository default,
# which can be write-all.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer worthless, so stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Measured on the first run that ever got this far: install 5 s, typecheck 18 s, lint 18 s,
    # migrate 2 s — and then the suite ran past 20 minutes, where this bound used to be, against 3.4
    # minutes on a development machine. 38 test files run serially (`fileParallelism: false`) and most
    # of the time is real database round trips. 45 minutes is a bound that still catches a hang
    # without failing a healthy run; the suite's own duration is a separate concern, recorded in
    # ARCHITECTURE_STATUS.md for the performance phase.
    timeout-minutes: 45
    services:
      postgres:
        # NOTE: production runs PostgreSQL 18.6. This is 16, which is also what the project's
        # local development database is. The mismatch is recorded in ARCHITECTURE_STATUS.md.
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: personal_os_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/personal_os_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/personal_os_test
      AUTH_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      # DO NOT add `with: { version: ... }` here. package.json carries `packageManager`, and
      # pnpm/action-setup refuses to start when a version is given in both places:
      #   "Multiple versions of pnpm specified ... Remove one of these versions"
      # It did, for 43 consecutive runs, and every step after it was skipped — so nothing in this
      # file had ever actually run. package.json is the single source of truth for the version.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
