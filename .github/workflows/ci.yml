name: CI
on:
  push:
    branches: ["**"]
  pull_request:

# This job only reads the repository. Without this block the token takes the repository default,
# which can be write-all.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer worthless, so stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 20, not 45. The run before this bound was set took over 20 minutes in `pnpm test` and I read
    # that as "the suite is simply slower on a CI runner" and loosened the bound. The very next run,
    # on the same code, finished the whole job in 4m16s with the suite at 2m35s — so that run hung,
    # and the inference was wrong. A bound should be proportionate to the observed time: 20 minutes
    # is ~5x the measured job and will surface a repeat of that hang in minutes instead of an hour.
    # The hang itself is recorded in BUG_REGISTER.md as a single unexplained occurrence.
    timeout-minutes: 20
    services:
      postgres:
        # NOTE: production runs PostgreSQL 18.6. This is 16, which is also what the project's
        # local development database is. The mismatch is recorded in ARCHITECTURE_STATUS.md.
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: personal_os_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/personal_os_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/personal_os_test
      AUTH_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      # DO NOT add `with: { version: ... }` here. package.json carries `packageManager`, and
      # pnpm/action-setup refuses to start when a version is given in both places:
      #   "Multiple versions of pnpm specified ... Remove one of these versions"
      # It did, for 43 consecutive runs, and every step after it was skipped — so nothing in this
      # file had ever actually run. package.json is the single source of truth for the version.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
